<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Update</title>
    <style>
        body {
            background-color: #000;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }
        .gear-container {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
        }
        .gear {
            width: 100%;
            height: 100%;
            fill: #fff;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .status-text {
            font-size: 18px;
            font-weight: 400;
            text-align: center;
            margin-bottom: 10px;
        }
        .progress-container {
            width: 60%;
            height: 4px;
            background-color: #333;
            border-radius: 2px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #fff;
        }
        .percentage {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="gear-container">
        <svg class="gear" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
            <path d="M19.4 13a1.6 1.6 0 00-1.4-1.3 1.6 1.6 0 00-1.3-1.4h-1.3a1.6 1.6 0 00-1.4 1.3V13h-1.3a1.6 1.6 0 00-1.4 1.3 1.6 1.6 0 001.3 1.4h1.3v1.3a1.6 1.6 0 001.3 1.4 1.6 1.6 0 001.4-1.3V13z" />
            <!-- Simplified gear shape -->
            <path d="M12 1L14 4H10L12 1Z M12 23L10 20H14L12 23Z M23 12L19 14V10L23 12Z M1 12L4 10V14L1 12Z" fill="white"/>
        </svg>
    </div>
    <div class="status-text">Updating System...</div>
    <div class="progress-container
